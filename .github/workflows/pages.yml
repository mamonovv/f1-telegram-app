name: Deploy Mini App

on:
  push:
    branches: [main]
    paths:
      - webapp/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Version frontend assets
        run: |
          sed -i 's/src="app.js"/src="app.js?v=${{ github.sha }}"/; s/href="style.css"/href="style.css?v=${{ github.sha }}"/' webapp/index.html
          sed -i 's/race-hero.webp/race-hero.webp?v=${{ github.sha }}/g' webapp/style.css
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: webapp
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
