name: Deploy Mini App

on:
  push:
    branches: [main]
    paths:
      - webapp/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/configure-pages@v5
      - name: Version frontend assets
        run: |
          sed -i 's/src="app.js"/src="app.js?v=${{ github.sha }}"/; s/href="style.css"/href="style.css?v=${{ github.sha }}"/' webapp/index.html
          sed -i 's/race-hero.webp/race-hero.webp?v=${{ github.sha }}/g' webapp/style.css
      - uses: actions/upload-pages-artifact@v4
        with:
          path: webapp
      - uses: actions/deploy-pages@v4
        id: deployment
