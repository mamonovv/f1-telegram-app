<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111115">
    <title>Формула 1</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js?65" defer></script>
    <script src="app.js" defer></script>
</head>
<body>
    <header class="site-header">
        <div class="shell">
            <div class="site-header__brand">Формула 1</div>
            <nav class="tabs" role="tablist" aria-label="Разделы">
                <button class="tabs__button"
                        type="button"
                        id="tab-schedule"
                        role="tab"
                        aria-controls="app"
                        aria-selected="true"
                        data-tab="schedule">
                    Расписание
                </button>
                <button class="tabs__button"
                        type="button"
                        id="tab-standings"
                        role="tab"
                        aria-controls="app"
                        aria-selected="false"
                        tabindex="-1"
                        data-tab="standings">
                    Таблица
                </button>
                <button class="tabs__button"
                        type="button"
                        id="tab-results"
                        role="tab"
                        aria-controls="app"
                        aria-selected="false"
                        tabindex="-1"
                        data-tab="results">
                    Результаты
                </button>
            </nav>
        </div>
    </header>

    <main class="shell"
          id="app"
          role="tabpanel"
          aria-labelledby="tab-schedule"
          tabindex="0">
        <section class="standings-controls" id="standings-controls" hidden>
            <h1 class="standings-controls__title">Зачёт сезона</h1>
            <div class="seg" role="group" aria-label="Вид зачёта">
                <button class="seg__button"
                        type="button"
                        data-mode="drivers"
                        aria-pressed="true">
                    Пилоты
                </button>
                <button class="seg__button"
                        type="button"
                        data-mode="constructors"
                        aria-pressed="false">
                    Команды
                </button>
            </div>
        </section>
        <div class="loader" id="app-loader" role="status">
            <span class="loader__ring" aria-hidden="true"></span>
            <span class="sr-only">Загрузка данных</span>
        </div>
        <div id="view" aria-busy="true"></div>
    </main>
</body>
</html>
